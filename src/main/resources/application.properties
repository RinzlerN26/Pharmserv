spring.application.name=pharmserv
server.port=8080
# Docker Configuration: 
# spring.datasource.url=jdbc:mysql://db-server:3306/pharmserv-db
# Local Configuraion:
spring.datasource.url=jdbc:mysql://localhost:3306/pharmserv-db
spring.datasource.username=mysql
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
springdoc.swagger-ui.path=/ms/docs
springdoc.api-docs.path=/ms/api-docs
rate-limit.capacity=5
rate-limit.refill-tokens=5
rate-limit.refill-duration-seconds=60
jwt.secret-key=${JWT_SECRET_KEY}
admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
admin.bootstrap.user-id=${ADMIN_BOOTSTRAP_USER_ID:admin}
admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:Administrator}
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@pharmserv.local}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD}
